<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐾 可爱动物园 · Cute Zoo</title>
  <meta name="description" content="可爱动物园：认识 12 只毛茸茸的小动物，点开卡片解锁它们的冷知识，支持搜索筛选、收藏、每日一动物与深色模式。" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("cuteZoo.theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* 无痕模式下忽略 */ }
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🐾 可爱动物园 · Cute Zoo" />
  <meta property="og:description" content="认识 12 只毛茸茸的小动物，解锁它们的冷知识，支持搜索筛选与链接分享。" />
  <meta property="og:url" content="https://eternal-yellowduck.github.io/zoo2026/" />
  <meta property="og:image" content="https://eternal-yellowduck.github.io/zoo2026/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky">
    <span class="cloud cloud-a">☁️</span>
    <span class="cloud cloud-b">☁️</span>
    <span class="cloud cloud-c">🍡</span>
  </div>

  <header class="site-header">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式">🌙</button>
    <h1 class="title">🐾 可爱动物园</h1>
    <p class="subtitle">欢迎来到毛茸茸的小世界 · Welcome to the Cute Zoo</p>
  </header>

  <section class="hero">
    <div class="hero-emoji" id="heroEmoji">🐰</div>
    <p class="hero-text">点一点下面的小动物，看看它们的小秘密吧！</p>
  </section>

  <section class="daily" id="dailySection" hidden aria-labelledby="dailyLabel">
    <p class="daily-label" id="dailyLabel">🌟 今日动物</p>
    <div class="daily-card">
      <span class="daily-emoji" id="dailyEmoji" aria-hidden="true"></span>
      <div class="daily-info">
        <span class="daily-name" id="dailyName"></span>
        <span class="daily-fact" id="dailyFact"></span>
      </div>
      <button class="daily-open" id="dailyOpen" type="button">去看看 →</button>
    </div>
  </section>

  <main>
    <div class="toolbar">
      <label class="visually-hidden" for="searchInput">搜索动物名称</label>
      <input type="search" id="searchInput" class="search-input"
        placeholder="🔍 搜索动物名称…" autocomplete="off" />
      <div class="chip-bar" id="chipBar" role="group" aria-label="按类别筛选"></div>
    </div>

    <ul class="animal-grid" id="animalGrid" aria-label="动物列表"></ul>
    <p class="empty-tip" id="emptyTip" hidden>没有找到匹配的小动物，换个关键词试试吧～</p>
  </main>

  <footer class="site-footer">
    <p>用 ❤️ 和 🐾 做成 · Made with love</p>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modalName">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭详情">✕</button>
      <button class="modal-fav" id="modalFav" type="button" aria-pressed="false" aria-label="收藏这只动物">♡</button>
      <div class="modal-emoji" id="modalEmoji">🐰</div>
      <h2 class="modal-name" id="modalName">小动物</h2>
      <p class="modal-name-en" id="modalNameEn"></p>
      <div class="modal-meta" id="modalMeta"></div>
      <ul class="modal-facts" id="modalFacts"></ul>
      <div class="modal-media" id="modalMedia" hidden></div>
    </div>
  </dialog>

  <script src="animals.js"></script>
  <script src="script.js"></script>
</body>
</html>
